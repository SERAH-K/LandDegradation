<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ReMiti — Profile</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* small inline styles to be standalone if styles.css missing */
    body{font-family:Arial,Helvetica,sans-serif;background:#f3faf1;margin:0;padding:28px;display:flex;justify-content:center}
    .card{width:100%;max-width:760px;background:#fff;padding:20px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.06)}
    h1{margin-top:0}
    .stats{display:flex;gap:16px;margin-bottom:16px}
    .stat{background:#f7fff7;padding:12px;border-radius:8px;flex:1;text-align:center}
    .btn{padding:10px 14px;border-radius:8px;border:0;font-weight:700;background:#2c9a4a;color:#fff;cursor:pointer}
    .btn-ghost{background:transparent;border:1px solid #ddd;padding:10px;border-radius:8px;cursor:pointer}
    .meta{color:#666}
    .msg.error{color:#b00020} .msg.ok{color:#0b6d2b}
  </style>
</head>
<body>
  <main class="card">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h1><i class="fas fa-user-circle"></i> Your Profile</h1>
      <button id="signout" style="background:transparent;border:0;color:#2c9a4a;cursor:pointer">Sign out</button>
    </div>
    <div id="user-meta" class="meta">Loading...</div>

    <div class="stats" id="stats" style="display:none">
      <div class="stat"><div id="trees" style="font-weight:700;font-size:20px">0</div><div class="meta">Trees planted</div></div>
      <div class="stat"><div id="points" style="font-weight:700;font-size:20px">0</div><div class="meta">Points</div></div>
    </div>

    <section>
      <h3>Record trees planted</h3>
      <p class="meta">Enter number of new trees (whole number). Points = floor(total_trees / 10).</p>

      <form id="trees-form" style="max-width:360px">
        <label for="trees-input">Number of trees</label>
        <input id="trees-input" type="number" min="1" required placeholder="e.g., 50">
        <div style="margin-top:10px;display:flex;gap:8px">
          <button class="btn" type="submit">Add trees</button>
          <button id="refresh" type="button" class="btn-ghost">Refresh</button>
        </div>
        <div id="msg" class="msg" aria-live="polite"></div>
      </form>
    </section>
  </main>

<script>
const API = '/api/profile';
const TOKEN_KEY = 'token'; // matches your signup code
const token = localStorage.getItem(TOKEN_KEY);

const userMeta = document.getElementById('user-meta');
const stats = document.getElementById('stats');
const treesEl = document.getElementById('trees');
const pointsEl = document.getElementById('points');
const msg = document.getElementById('msg');

function showMsg(text, type='error'){ msg.textContent = text; msg.className = 'msg ' + (type==='ok' ? 'ok' : 'error'); }

function requireLogin(){ showMsg('You are not signed in — redirecting...', 'error'); setTimeout(()=>location.href='signin.html',800); }

if (!token) requireLogin();
else fetchProfile();

async function fetchProfile(){
  try {
    const r = await fetch(API, { headers: { 'Authorization': 'Bearer ' + token } });
    if (r.status === 401) return requireLogin();
    if (!r.ok) { showMsg('Failed to load profile'); return; }
    const u = await r.json();
    userMeta.textContent = `${u.name} — ${u.email}`;
    treesEl.textContent = u.trees_planted;
    pointsEl.textContent = u.points;
    stats.style.display = 'flex';
    msg.textContent = '';
  } catch (e) {
    console.error(e);
    showMsg('Network error');
  }
}

document.getElementById('trees-form').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  msg.textContent = '';
  const n = Number(document.getElementById('trees-input').value);
  if (!Number.isInteger(n) || n <= 0) return showMsg('Enter a positive whole number');
  try {
    const r = await fetch(API + '/trees', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ trees: n })
    });
    const payload = await r.json();
    if (r.status === 401) return requireLogin();
    if (!r.ok) return showMsg(payload.message || 'Could not update');
    const u = payload.user;
    treesEl.textContent = u.trees_planted;
    pointsEl.textContent = u.points;
    showMsg('Saved — thanks for planting!', 'ok');
    document.getElementById('trees-input').value = '';
  } catch (e) {
    console.error(e);
    showMsg('Network error while saving');
  }
});

document.getElementById('refresh').addEventListener('click', fetchProfile);
document.getElementById('signout').addEventListener('click', () => { localStorage.removeItem(TOKEN_KEY); location.href = 'signin.html'; });
</script>
</body>
</html>
